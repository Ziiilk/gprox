name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Verify tag and package versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-version.ps1 -Tag $env:RELEASE_TAG
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package executable and checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: gprox-windows-release
          path: |
            dist/gprox-x86_64-pc-windows-msvc.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gprox-windows-release
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/gprox-x86_64-pc-windows-msvc.zip
            artifacts/SHA256SUMS
